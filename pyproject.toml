[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "Savannah_Shannon_CV_Benchmarking"
version = "1.0.0"
description = "A resuable Python package for benchmarking image classification models fairly"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Savannah Shannon", email = "snshannon2002@gmail.com"}]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pillow>=8.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.8.0"]
dev = ["pytest>=6.0","pytest-cov"]

[tool.setuptools]
packages = ["savannah_shannon_cv_benchmarking"]

[tool.setuptools.package-dir]
"" = "src"